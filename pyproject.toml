[project]
name = "InsightEN"
version = "0.1.0"
description = "A financial insights tool using finvizfinance and pandas"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "finvizfinance",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
    "pre-commit",
    "python-dotenv", # Loads .env files
    "alpha-vantage", # Alpha Vantage API wrapper
    "transformers",  # Hugging Face's library for models like BERT
    "torch",         # The deep learning framework BERT runs on
    "textblob",      # We'll use this later to compare against FinBERT
    "pydantic",
]

[tool.ruff]
# Enable linting & auto-fix
line-length = 88
target-version = "py312"
fix = true
extend-exclude = ["venv"]

# Ignore certain rules if needed (example: long lines in URLs)
# ignore = ["E501"]

[tool.ruff.format]
# Black-compatible formatting
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E",   # Style
  "F",   # Pyflakes (runtime errors, unused)
  "B",   # Bugbear (common Python gotchas)
  "UP",  # Pyupgrade (modern syntax)
  "I",   # Import sorting (like isort)
  "BLE"  # Blind except
]

[tool.pytest.ini_options]
# Configure pytest options (optional)
addopts = "-v --cov=src --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
